<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" width="28" height="20" shape-rendering="crispEdges">
  <defs>
    <style>
      .vinyl-dark { fill: #212121; }
      .vinyl-shadow { fill: #181818; }
      .vinyl-rim { fill: #37474F; }
      .label-orange { fill: #FF7043; }
      .label-yellow { fill: #FFD54F; }
      .label-teal { fill: #4DB6AC; }
      .label-center { fill: #FFFFFF; }
      .groove-line { stroke: #37474F; stroke-width: 0.7; fill: none; }
      .sheen-light { stroke: #ECEFF1; stroke-width: 0.8; fill: none; opacity: 0.6; stroke-linecap: round; }
      .note-gold { fill: #FBC02D; stroke: #2E221F; stroke-width: 0.6; }
      .note-teal { fill: #4DB6AC; stroke: #2E221F; stroke-width: 0.6; }
      .sparkle-glow { fill: #FFF176; opacity: 0.9; }
      .prop-outline { stroke: #2E221F; stroke-width: 1.2; stroke-linecap: square; stroke-linejoin: miter; }
      .prop-outline-thin { stroke: #2E221F; stroke-width: 0.8; stroke-linecap: square; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- RETRO VINYL STACK PROP (Heavy RAM >80% Overlay for DJ Cockatiel)          -->
  <!-- Size: 28 x 20 px                                                          -->
  <!-- ========================================================================= -->

  <!-- Top Floating Musical Sparkle Accents -->
  <g id="sparkle-vibes">
    <!-- Floating Gold Note ♪ Top Left -->
    <g transform="translate(3, 1)">
      <ellipse cx="2" cy="4.5" rx="1.5" ry="1.1" class="note-gold" transform="rotate(-20 2 4.5)"/>
      <line x1="3.2" y1="3.8" x2="3.2" y2="0.8" stroke="#2E221F" stroke-width="0.8"/>
      <path d="M3.2 0.8 C4.2 1.4, 5 1.8, 5.5 1.2" fill="none" stroke="#2E221F" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- Floating Teal Note ♪ Top Right -->
    <g transform="translate(21, 2)">
      <ellipse cx="2" cy="4.5" rx="1.5" ry="1.1" class="note-teal" transform="rotate(-20 2 4.5)"/>
      <line x1="3.2" y1="3.8" x2="3.2" y2="0.8" stroke="#2E221F" stroke-width="0.8"/>
      <path d="M3.2 0.8 C4.2 1.4, 5 1.8, 5.5 1.2" fill="none" stroke="#2E221F" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <!-- Sparkle Diamond -->
    <polygon points="14,0.5 15,2 14,3.5 13,2" class="sparkle-glow"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TIER 1: Bottom Base Vinyl Record (Large Base Platter)                     -->
  <!-- ========================================================================= -->
  <g id="bottom-vinyl">
    <ellipse cx="14" cy="16.5" rx="12" ry="3.2" class="vinyl-shadow prop-outline"/>
    <ellipse cx="14" cy="16" rx="11.5" ry="2.8" class="vinyl-dark"/>
    <!-- Outer Rim & Concentric Grooves -->
    <ellipse cx="14" cy="16" rx="10" ry="2.2" class="groove-line"/>
    <ellipse cx="14" cy="16" rx="8" ry="1.7" class="groove-line"/>
    <!-- Center Label (Retro Teal) -->
    <ellipse cx="14" cy="16" rx="3.8" ry="1.1" class="label-teal prop-outline-thin"/>
    <circle cx="14" cy="16" r="0.5" class="label-center"/>
    <!-- Surface Sheen -->
    <path d="M4 16 C6 17.5, 9 17.8, 11 17" class="sheen-light"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TIER 2: Middle-Lower Vinyl Record (Slightly Staggered Left)                -->
  <!-- ========================================================================= -->
  <g id="middle-low-vinyl">
    <ellipse cx="13" cy="13.5" rx="11" ry="3" class="vinyl-shadow prop-outline"/>
    <ellipse cx="13" cy="13" rx="10.5" ry="2.6" class="vinyl-dark"/>
    <ellipse cx="13" cy="13" rx="9" ry="2" class="groove-line"/>
    <ellipse cx="13" cy="13" rx="7" ry="1.5" class="groove-line"/>
    <!-- Center Label (Retro Yellow) -->
    <ellipse cx="13" cy="13" rx="3.5" ry="1" class="label-yellow prop-outline-thin"/>
    <circle cx="13" cy="13" r="0.5" class="label-center"/>
    <!-- Sheen -->
    <path d="M4 13 C6 14.3, 9 14.5, 11 13.8" class="sheen-light"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TIER 3: Middle-Upper Vinyl Record (Slightly Staggered Right)               -->
  <!-- ========================================================================= -->
  <g id="middle-high-vinyl">
    <ellipse cx="15" cy="10.5" rx="10.5" ry="2.8" class="vinyl-shadow prop-outline"/>
    <ellipse cx="15" cy="10" rx="10" ry="2.4" class="vinyl-dark"/>
    <ellipse cx="15" cy="10" rx="8.5" ry="1.8" class="groove-line"/>
    <ellipse cx="15" cy="10" rx="6.5" ry="1.3" class="groove-line"/>
    <!-- Center Label (Retro Orange) -->
    <ellipse cx="15" cy="10" rx="3.2" ry="0.9" class="label-orange prop-outline-thin"/>
    <circle cx="15" cy="10" r="0.5" class="label-center"/>
    <!-- Sheen -->
    <path d="M19 10 C21 11.2, 23 11.2, 24.5 10.5" class="sheen-light"/>
  </g>

  <!-- ========================================================================= -->
  <!-- TIER 4: Top Crown Vinyl Record (Tilted at Apex)                           -->
  <!-- ========================================================================= -->
  <g id="top-vinyl">
    <ellipse cx="14" cy="7.2" rx="9.5" ry="2.6" class="vinyl-shadow prop-outline"/>
    <ellipse cx="14" cy="6.8" rx="9" ry="2.2" class="vinyl-dark"/>
    <ellipse cx="14" cy="6.8" rx="7.5" ry="1.6" class="groove-line"/>
    <ellipse cx="14" cy="6.8" rx="5.5" ry="1.2" class="groove-line"/>
    <!-- Center Label (Retro Orange & Gold Ring) -->
    <ellipse cx="14" cy="6.8" rx="3" ry="0.8" class="label-orange prop-outline-thin"/>
    <ellipse cx="14" cy="6.8" rx="1.8" ry="0.5" class="label-yellow"/>
    <circle cx="14" cy="6.8" r="0.4" class="label-center"/>
    <!-- Top Vinyl Gloss Sheens (Left & Right Highlight Beams) -->
    <path d="M6.5 6.8 C8 7.8, 10.5 8, 12 7.4" class="sheen-light"/>
    <path d="M16 6.2 C18 6.4, 20.5 6.8, 22 7.4" class="sheen-light"/>
  </g>

  <!-- Glistening Ambient Light Beams -->
  <g id="glistening-lights">
    <circle cx="1" cy="16" r="0.4" class="sparkle-glow"/>
    <circle cx="27" cy="14" r="0.4" class="sparkle-glow"/>
    <circle cx="14" cy="4.2" r="0.5" class="sparkle-glow"/>
  </g>
</svg>

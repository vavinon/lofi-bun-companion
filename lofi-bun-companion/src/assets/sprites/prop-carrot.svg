<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" width="28" height="20" shape-rendering="crispEdges">
  <defs>
    <style>
      .carrot-body { fill: #FF9A3C; }
      .carrot-shadow { fill: #E07A20; }
      .carrot-light { fill: #FFAE5E; }
      .leaf-base { fill: #7FB069; }
      .leaf-shadow { fill: #5A8449; }
      .ribbon-base { fill: #FFB5B5; }
      .ribbon-shadow { fill: #E09898; }
      .prop-outline { stroke: #2E221F; stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }
      .prop-outline-thin { stroke: #2E221F; stroke-width: 1; stroke-linecap: square; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- CARROT STACK PROP (Heavy RAM >80% Overlay for Lo-fi Bun)                  -->
  <!-- Size: 28 x 20 px                                                          -->
  <!-- ========================================================================= -->

  <!-- Top Carrot Leaf Tufts -->
  <path d="M12 4 C10 1, 8 3, 7 0 C10 0, 12 2, 13 4 Z" class="leaf-shadow" stroke="#2E221F" stroke-width="1"/>
  <path d="M14 4 C14 0, 16 0, 16 0 C17 2, 16 3, 15 4 Z" class="leaf-base" stroke="#2E221F" stroke-width="1"/>
  <path d="M16 4 C18 1, 20 2, 21 0 C19 1, 18 3, 17 4 Z" class="leaf-base" stroke="#2E221F" stroke-width="1"/>

  <!-- Left Bottom Carrot (Horizontal Stack Left) -->
  <g id="bottom-left-carrot">
    <!-- Leaf Left -->
    <path d="M2 13 C0 11, 1 9, 0 8 C2 9, 3 11, 4 12 Z" class="leaf-shadow" stroke="#2E221F" stroke-width="1"/>
    <!-- Carrot Body -->
    <path d="M3 13 C3 10, 8 9, 13 11 C14 14, 8 16, 4 15 C3 14, 3 13.5, 3 13 Z" class="carrot-shadow prop-outline"/>
    <path d="M4 12 C4 10, 9 9.5, 13 11 C13 13, 8 14.5, 5 14 C4 13.5, 4 13, 4 12 Z" class="carrot-body"/>
    <!-- Ridge Lines -->
    <line x1="6" y1="11" x2="8" y2="13" class="prop-outline-thin" opacity="0.6"/>
    <line x1="9" y1="11.5" x2="11" y2="13.5" class="prop-outline-thin" opacity="0.6"/>
  </g>

  <!-- Right Bottom Carrot (Horizontal Stack Right) -->
  <g id="bottom-right-carrot">
    <!-- Leaf Right -->
    <path d="M26 13 C28 11, 27 9, 28 8 C26 9, 25 11, 24 12 Z" class="leaf-base" stroke="#2E221F" stroke-width="1"/>
    <!-- Carrot Body -->
    <path d="M25 13 C25 10, 20 9, 15 11 C14 14, 20 16, 24 15 C25 14, 25 13.5, 25 13 Z" class="carrot-shadow prop-outline"/>
    <path d="M24 12 C24 10, 19 9.5, 15 11 C15 13, 20 14.5, 23 14 C24 13.5, 24 13, 24 12 Z" class="carrot-body"/>
    <!-- Ridge Lines -->
    <line x1="22" y1="11" x2="20" y2="13" class="prop-outline-thin" opacity="0.6"/>
    <line x1="19" y1="11.5" x2="17" y2="13.5" class="prop-outline-thin" opacity="0.6"/>
  </g>

  <!-- Top Center Plump Carrot -->
  <g id="top-center-carrot">
    <!-- Carrot Body -->
    <path d="M14 5 C19 5, 21 8, 20 12 C18 15, 14 16, 14 16 C14 16, 10 15, 8 12 C7 8, 9 5, 14 5 Z" class="carrot-shadow" stroke="#2E221F" stroke-width="1.5"/>
    <path d="M14 5.5 C18 5.5, 20 8, 19 11.5 C17.5 14, 14 15, 14 15 C14 15, 10.5 14, 9 11.5 C8 8, 10 5.5, 14 5.5 Z" class="carrot-body"/>
    <!-- Highlight -->
    <path d="M11 7 C12 6, 15 6, 16 7" stroke="#FFAE5E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Cute Horizontal Ridge Textures -->
    <line x1="10" y1="9" x2="13" y2="9" class="prop-outline-thin" opacity="0.7"/>
    <line x1="15" y1="11" x2="18" y2="11" class="prop-outline-thin" opacity="0.7"/>
    <line x1="12" y1="13" x2="15" y2="13" class="prop-outline-thin" opacity="0.7"/>
  </g>

  <!-- Cozy Sage / Pink Ribbon Tie around stack -->
  <g id="ribbon-tie">
    <ellipse cx="14" cy="14" rx="5" ry="2" class="ribbon-shadow" stroke="#2E221F" stroke-width="1"/>
    <ellipse cx="14" cy="13.5" rx="5" ry="1.8" class="ribbon-base"/>
    <!-- Bow Knot -->
    <circle cx="14" cy="13.5" r="1.5" fill="#FFFFFF" stroke="#2E221F" stroke-width="1"/>
    <circle cx="11.5" cy="14" r="1.2" class="ribbon-base" stroke="#2E221F" stroke-width="0.8"/>
    <circle cx="16.5" cy="14" r="1.2" class="ribbon-base" stroke="#2E221F" stroke-width="0.8"/>
  </g>
</svg>

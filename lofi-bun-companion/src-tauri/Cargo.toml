[package]
name = "lofi-bun-companion"
version = "1.0.0"
description = "Lo-fi Bun Companion - The Hardware Desk Pet Mascot"
authors = ["Lo-fi Bun Companion Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
